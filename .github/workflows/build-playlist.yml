name: build-playlist

on:
  workflow_dispatch:   # 手动触发：Actions 页面点 Run workflow
  # schedule:          # 想自动更新的话，取消这两行注释（UTC 时间，每天 22:00 = 北京时间次日 06:00）
  #   - cron: "0 22 * * *"

permissions:
  contents: write      # 需要把生成的 tr.m3u 提交回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install requests

      - name: 生成播放列表
        run: python main.py
        # env:
        #   STREAM_EXT: m3u8   # 如果盒子播不了 ts，取消这两行注释改成 m3u8

      - name: 提交 tr.m3u（有变化才提交）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tr.m3u
          git diff --cached --quiet || (git commit -m "update tr.m3u" && git push)